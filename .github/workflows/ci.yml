name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and test protocol core
        working-directory: packages/nmx-protocol
        run: |
          npm install
          npx tsc --noEmit
          npm test
          npm run build
      - name: CLI smoke test against simulator
        working-directory: packages/nmx-cli
        run: |
          npm install
          node cli.js info --sim

  package-macos:
    needs: test
    runs-on: macos-latest
    if: github.ref == 'refs/heads/main'
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build core
        working-directory: packages/nmx-protocol
        run: |
          npm install
          npm run build
      - name: Package unsigned dmg
        working-directory: apps/jog-slice
        run: |
          npm install
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: GraffikNG-macos-unsigned
          path: apps/jog-slice/release/*.dmg
