name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - name: Install and test protocol core
        working-directory: packages/nmx-protocol
        run: |
          npm ci
          npx tsc --noEmit
          npm test
          npm run build
      - name: CLI smoke test against simulator
        working-directory: packages/nmx-cli
        run: |
          npm ci
          node cli.js info --sim

      # The reference firmware is the other half of the Tier-2 contract, and it
      # used to be the only part of the repo nothing checked. Compiling it
      # against a host shim and driving its protocol state machine catches the
      # class of bug that otherwise waits for a board to exist.
      - name: Exercise the reference firmware
        run: |
          g++ -std=c++17 -Wall -I firmware/graffik-trig/test \
              -o /tmp/fwtest firmware/graffik-trig/test/test_firmware.cpp
          /tmp/fwtest

      # Two implementations of one wire protocol drift, and the direction that
      # hurts is the simulator being MORE permissive than the board: every test
      # passes and the rig fails. It had already happened once.
      # A function that is exported, tested, passing and callable by nothing
      # LOOKS covered. One shipped that way in v0.13 and was caught by luck.
      - name: Dead-export audit
        run: node scripts/audit-exports.mjs --strict

      - name: Protocol parity — simulator vs firmware
        run: node firmware/graffik-trig/test/parity.mjs

      # The command vocabulary against the firmware dispatch, from a committed
      # fact table — CI never needs the GPL clone.
      - name: Command vocabulary vs the dispatch
        run: node scripts/audit-vocabulary.mjs --strict

      # A duplicate ipcMain.handle throws at startup, and a preload method
      # invoking a channel nobody handles fails only when somebody clicks it.
      - name: IPC surface — main and preload agree
        run: node scripts/audit-ipc.mjs

      # Nothing above loads the Electron main process. This boots the real app
      # under a virtual display and fails on a crash or an early exit. It skips
      # itself, loudly, on macOS (no xvfb) — the ubuntu leg is the one that
      # must pass.
      - name: The app actually starts
        working-directory: apps/jog-slice
        run: npm ci
      - name: Boot the app headlessly
        run: ./scripts/smoke-electron.sh

  package-macos:
    needs: test
    runs-on: macos-latest
    if: github.ref == 'refs/heads/main'
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - name: Build core
        working-directory: packages/nmx-protocol
        run: |
          npm ci
          npm run build
      - name: Package unsigned dmg
        working-directory: apps/jog-slice
        run: |
          npm ci
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: GraffikNG-macos-unsigned
          path: apps/jog-slice/release/*.dmg
